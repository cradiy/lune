[package]
name = "lune"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["desktop"]
desktop = [
    "wgpu-renderer", "dep:calloop", "dep:calloop-wayland-source", "dep:cosmic-text",
    "dep:env_logger", "dep:event-listener", "dep:futures-lite", "dep:guillotiere",
    "dep:image", "dep:log", "dep:lune-text", "dep:pollster", "dep:regex", "dep:resvg", "dep:unicode-segmentation", "dep:zbus",
    "dep:wayland-backend", "dep:wayland-client", "dep:wayland-protocols", "dep:wayland-scanner",
    "dep:wl-clipboard-rs", "dep:winit",
]
wgpu-renderer = ["dep:bytemuck", "dep:wgpu"]

[[bin]]
name = "lune"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
lune-terminal = { path = "../crates/terminal" }
lune-pty = { path = "../crates/pty" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
bytemuck = { version = "1", optional = true }
calloop = { version = "0.13", optional = true }
calloop-wayland-source = { version = "0.3", optional = true }
cosmic-text = { version = "0.19", optional = true }
env_logger = { version = "0.11", default-features = false, features = ["humantime"], optional = true }
event-listener = { version = "5", optional = true }
futures-lite = { version = "2", optional = true }
guillotiere = { version = "0.7", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
log = { version = "0.4", optional = true }
lune-text = { path = "../crates/text", optional = true }
pollster = { version = "0.4", optional = true }
regex = { version = "1", optional = true }
resvg = { version = "0.46", default-features = false, optional = true }
unicode-segmentation = { version = "=1.13.3", optional = true }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"], optional = true }
wayland-client = { version = "0.31", features = ["system", "dlopen"], optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"], optional = true }
wayland-scanner = { version = "0.31", optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }
wl-clipboard-rs = { version = "0.9.5", optional = true }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita"], optional = true }
zbus = { version = "5", default-features = false, features = ["async-io"], optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
pollster = "0.4"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
