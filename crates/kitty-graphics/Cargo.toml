[package]
name = "lune-kitty-graphics"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Kitty terminal graphics protocol"

[dependencies]
base64 = "0.22.1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
moxcms = { version = "0.8.1", features = ["extended_range"] }
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "shm"] }

[dev-dependencies]
lune-vt = { path = "../vt" }
