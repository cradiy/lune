[package]
name = "lune-terminal-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lune-terminal = { path = ".." }
lune-vt = { path = "../../vt" }

[workspace]
members = ["."]

[[bin]]
name = "storage"
path = "fuzz_targets/storage.rs"
test = false
doc = false
bench = false

[[bin]]
name = "screen"
path = "fuzz_targets/screen.rs"
test = false
doc = false
bench = false

[[bin]]
name = "processor"
path = "fuzz_targets/processor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "style"
path = "fuzz_targets/style.rs"
test = false
doc = false
bench = false
