[package]
name = "lune-terminal-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lune-terminal = { path = ".." }
lune-vt = { path = "../../vt" }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[workspace]
members = ["."]

[[bin]]
name = "storage"
path = "fuzz_targets/storage.rs"
test = false
doc = false
bench = false

[[bin]]
name = "screen"
path = "fuzz_targets/screen.rs"
test = false
doc = false
bench = false

[[bin]]
name = "processor"
path = "fuzz_targets/processor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "style"
path = "fuzz_targets/style.rs"
test = false
doc = false
bench = false

[[bin]]
name = "styles"
path = "fuzz_targets/styles.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unicode"
path = "fuzz_targets/unicode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "history"
path = "fuzz_targets/history.rs"
test = false
doc = false
bench = false
