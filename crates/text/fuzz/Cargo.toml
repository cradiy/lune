[package]
name = "lune-text-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lune-text = { path = ".." }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[workspace]
members = ["."]

[[bin]]
name = "graphemes"
path = "fuzz_targets/graphemes.rs"
test = false
doc = false
bench = false
